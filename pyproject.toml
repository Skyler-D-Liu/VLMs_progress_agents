[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-vlm-benchmark"
version = "0.1.0"
description = "Evaluation and fine-tuning workflows for general-purpose VLMs in Earth observation"
requires-python = ">=3.10"
[tool.setuptools.packages.find]
include = ["agents_benchmark*", "evaluation*", "finetune*", "vleo_runtime*"]

[tool.setuptools.package-data]
finetune = ["*.yaml", "experiment_specs/*.yaml", "experiment_specs/*.json", "experiment_specs/datasets/*.yaml", "experiment_specs/models/*.yaml"]

